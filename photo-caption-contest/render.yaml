services:
  - type: web
    name: photo-caption-contest-api
    env: node
    plan: free
    buildCommand: npm ci && npx sequelize-cli db:migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: photo-caption-contest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: photo-caption-contest-db
    plan: free
